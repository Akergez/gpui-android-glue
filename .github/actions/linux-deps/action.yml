name: Linux build dependencies
description: >
  The libraries the toolkit links on a Linux desktop, and the registry cache
  every Rust job shares.

runs:
  using: composite
  steps:
    - name: apt
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends \
          pkg-config \
          libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev \
          libfontconfig-dev libfreetype-dev
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-registry-${{ runner.os }}-${{ runner.arch }}-

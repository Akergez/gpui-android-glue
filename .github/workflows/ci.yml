# Every commit: the crate on the desktop and for Android, the IME tests, and
# the Android library. What build-aux/check.sh does locally.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GRADLE_VERSION: "9.2.1"
  CARGO_NDK_VERSION: "4.1.2"

permissions:
  contents: read

jobs:
  rust:
    # The x86-64 runner: Google builds the NDK for no other Linux.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/linux-deps
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
      - run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` is killed when sdkmanager has read enough, which is not a failure.
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: cargo ndk -t arm64-v8a --platform 26 clippy --locked --all-features -- -D warnings

  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: bash build-aux/ime-tests.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Install Android SDK components
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: gradle --no-daemon assembleRelease
        working-directory: android

# A release is a tag `vX.Y.Z` on a commit whose crate says X.Y.Z. The Rust
# half is released by the tag itself (applications depend on it by git tag);
# the Java half is published here, to GitHub Packages, as
# com.akergez.gpui:android-glue:X.Y.Z — as tresse-kmp publishes its library.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GRADLE_VERSION: "9.4.1"

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/linux-deps
      # Nothing is published under a number the crate does not carry.
      - run: build-aux/check-version.sh "$GITHUB_REF_NAME"
      - run: cargo test --locked
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: bash build-aux/ime-tests.sh

  publish-maven:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Install Android SDK components
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Publish
        id: publish
        working-directory: android
        # An amended tag re-runs this job; the Java half has not changed if the
        # AAR was already published under this version, and Maven refuses to
        # overwrite it. The next step accepts that.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle --no-daemon publishReleasePublicationToGitHubPackagesRepository
      - name: Accept a version that is already published
        if: steps.publish.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://maven.pkg.github.com/${GITHUB_REPOSITORY,,}/com/akergez/gpui/android-glue/${version}/android-glue-${version}.pom"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" "$url")
          if [ "$code" != 200 ]; then
            echo "publishing ${version} failed, and it is not in the registry" >&2
            exit 1
          fi
          echo "android-glue ${version} is already published; keeping it."

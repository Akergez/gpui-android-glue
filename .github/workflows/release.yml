# A release is a tag `vX.Y.Z` on a commit whose crate says X.Y.Z. The Rust
# half is released by the tag itself (applications depend on it by git tag);
# the Java half is published here, to GitHub Packages, as
# com.akergez.gpui:android-glue:X.Y.Z — as tresse-kmp publishes its library.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GRADLE_VERSION: "9.2.1"

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/linux-deps
      # Nothing is published under a number the crate does not carry.
      - run: build-aux/check-version.sh "$GITHUB_REF_NAME"
      - run: cargo test --locked
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: bash build-aux/ime-tests.sh

  publish-maven:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Install Android SDK components
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Publish
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle --no-daemon publishReleasePublicationToGitHubPackagesRepository
